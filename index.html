   title:{ru:"Пакет",ko:"음식물 봉투",en:"Food-waste bag",vi:"Túi rác",ja:"専用袋",zh:"专用袋"},
   text:{ru:"Купите жёлтый пакет для пищевых отходов в магазине. Отжмите воду, положите еду и выставьте пакет в указанное место.",ko:"마트나 편의점에서 노란색 음식물 봉투를 사세요. 물기를 빼고 음식물을 담아 지정 장소에 내옷세요.",en:"Buy a yellow food-waste bag in a shop. Drain the liquid, put the food inside and leave the bag at the designated spot.",vi:"Mua túi màu vàng dành cho rác thực phẩm ở siêu thị. Vắt ráo nước, bỏ thực phẩm vào và đặt túi ở nơi quy định.",ja:"スーパーで黄色い生ごみ専用袋を買います。水気を切り、食べ物を入れて指定の場所に出します。",zh:"在超市买黄色的厨余专用袋。沿干水分，装入食物，放到指定地点。"}},

   title:{ru:"Машина с карточкой",ko:"RFID 기계",en:"Machine with a card",vi:"Máy có thẻ",ja:"カード式の機械",zh:"刷卡机"},
   text:{ru:"Подойдите к машине в доме, приложите карточку и высыпьте еду без пакета. Машина взвешивает, а плата приходит раз в месяц.",ko:"건물의 기계에 카드를 대고 봉투 없이 음식물을 버리세요. 기계가 무게를 재고, 요금은 한 달에 한 번 청구됩니다.",en:"Tap your card on the machine in your building and tip the food in without a bag. It weighs it, and you are billed once a month.",vi:"Đến máy trong tòa nhà, chạm thẻ và đổ thực phẩm vào mà không cần túi. Máy cân trọng lượng, tiền được tính mỗi tháng một lần.",ja:"建物の機械にカードをかざし、袋なしで生ごみを入れます。機械が重さを量り、料金は月に1回請求されます。",zh:"走到楼里的机器前，刷卡后直接倒入食物，不用袋子。机器会称重，每月收费一次。"}},

   text:{ru:"Купите зелёное ведёрко 5 или 7 литров и стикер (납부필증) на рынке. Наклейте стикер на крышку и выбрасывайте еду без пакета, в указанное время и место. Пример: район Сасан-гу в Пусане, выносить с 19 до 23 часов. Без стикера мусор не заберут.",ko:"재래시장에서 5리터 또는 7리터 녹색 수거용기와 납부필증을 구입하세요. 납부필증을 뚜껑에 붙이고, 봉투 없이 음식물만 버리세요. 지정된 시간과 장소에 내놓으세요. 납부필증이 없으면 수거하지 않습니다.",vi:"Mua thùng xanh 5 hoặc 7 lít và tem thanh toán (납부필증) ở chợ truyền thống. Dán tem lên nắp, bỏ thực phẩm vào không dùng túi, đặt đúng giờ và đúng chỗ. Không có tem thì không được thu gom.",en:"Buy a green 5 L or 7 L bin and a payment sticker (납부필증) at a traditional market. Stick the sticker on the lid, put food in without a bag, and leave it at the designated time and place. Without the sticker, it will not be collected.",ja:"伝統市場で緑色の5Lまたは7Lの容器と納付済みシール（납부필증）を買います。シールをふたに貼り、袋を使わずに生ごみだけを入れて、指定の時間と場所に出します。シールがないと回収されません。",zh:"在传统市场购买绿色的5升或7升容器和缴费贴纸（납부필증）。把贴纸贴在盖子上，不用袋子直接装入厨余，在指定时间和地点放出。没有贴纸不会收运。"}}

const BIN_T = {"ru": "Контейнер + стикер: как пользоваться", "ko": "음식물 전용 용기 + 납부필증: 사용 방법", "en": "Food-waste container + payment sticker: how to use", "vi": "Thùng riêng + tem thanh toán: cách dùng", "ja": "専用容器＋納付シール：使い方", "zh": "专用容器＋缴费贴纸：使用方法"};
const BIN_S = {"ru": ["Купите контейнер для пищевых отходов и стикер (납부필증) в магазине. Пример: Пусан, район Сасан, контейнер 5 литров.", "Приклейте стикер на контейнер. Напишите на контейнере и стикере имя и адрес.", "Кладите пищевые отходы в контейнер без пакета. Сначала отожмите воду.", "Выставляйте контейнер в указанное время и место. Пример: Сасан, с 19:00 до 23:00, у входа или в подъезде на первом этаже.", "Контейнер без стикера не заберут. Незаконный выброс может стоить штраф до 1 000 000 вон."], "ko": ["마트나 판매처에서 음식물 전용 용기와 납부필증(스티커)을 구입하세요. 예: 부산 사상구 5L 가정용 용기.", "납부필증을 용기에 붙이세요. 용기와 스티커에 이름과 주소를 적으면 분실을 막을 수 있습니다.", "봉투 없이 음식물을 용기에 넣으세요. 먼저 물기를 빼세요.", "지정된 시간과 장소에 내놓으세요. 예: 사상구 저녁 7시~11시, 대문 앞 또는 1층 현관 앞.", "스티커가 없는 용기는 수거하지 않습니다. 무단 투기는 100만 원 이하 과태료입니다."], "en": ["Buy a food-waste container and a payment sticker (납부필증) at a shop. Example: Sasang-gu, Busan, 5 L household container.", "Attach the sticker to the container. Write your name and address on the container and the sticker.", "Put food waste in the container without a bag. Drain the liquid first.", "Put it out at the time and place your district sets. Example: Sasang-gu, 7 pm to 11 pm, at the front door or the first-floor entrance.", "Containers without a sticker are not collected. Illegal dumping can be fined up to 1,000,000 won."], "vi": ["Mua thùng riêng cho rác thực phẩm và tem thanh toán (납부필증) ở cửa hàng. Ví dụ: quận Sasang, Busan, thùng gia đình 5 lít.", "Dán tem lên thùng. Ghi tên và địa chỉ lên thùng và tem.", "Bỏ rác thực phẩm vào thùng, không dùng túi. Vắt ráo nước trước.", "Đem thùng ra đúng giờ và đúng nơi quy định. Ví dụ: quận Sasang, 19:00–23:00, trước cửa nhà hoặc sảnh tầng 1.", "Thùng không có tem sẽ không được thu gom. Đổ rác trái phép có thể bị phạt đến 1.000.000 won."], "ja": ["店で生ごみ専用容器と納付済みシール（납부필증）を買います。例：釜山・沙上区、5リットルの家庭用容器。", "容器にシールを貼ります。容器とシールに名前と住所を書きましょう。", "袋を使わず、生ごみを容器に入れます。先に水気を切ってください。", "決められた時間と場所に出します。例：沙上区の19時〜23時、玄関前または1階の入口。", "シールのない容器は回収されません。不法投棄は100万ウォン以下の過料です。"], "zh": ["在商店购买厨余专用容器和缴费贴纸（납부필증）。例：釜山沙上区，5升家用容器。", "把贴纸贴在容器上。在容器和贴纸上写上姓名和地址。", "不用袋子，直接把厨余倒入容器。先沥干水分。", "在规定的时间和地点放出。例：沙上区晚上7点到11点，放在大门口或一楼入口处。", "没有贴纸的容器不会被收走。非法丢弃最高罚款100万韩元。"]};

function bagTable() {

}

function renderHome() {
  const tiles = ORDER.map(id => `<a class="tile" href="#${id}"><span class="emoji">${CATS[id].emoji}</span><span>${CATS[id].name[lang]}</span></a>`).join("");
  return `
    <section class="hero-title"><h1 class="tagline">${t("tagline")}</h1><p class="sub">${t("sub")}</p></section>
    <h2>${t("tilesHint")}</h2>
    <div class="tiles">${tiles}</div>
    <div class="note">${t("districtNote")}</div>`;
}

function renderCat(id) {
  const c = CATS[id];
  const list = arr => `<ul>${arr[lang].map(x => `<li>${x}</li>`).join("")}</ul>`;
  return `
    <button class="back" onclick="location.hash='home'">${t("back")}</button>
    <div class="big-emoji">${c.emoji}</div>
    <h1>${c.name[lang]}</h1>
    ${cityPick()}
    <div class="card yes"><h2>✅ ${t("inc")}</h2>${list(c.inc)}</div>
    <div class="card no"><h2>❌ ${t("no")}</h2>${list(c.no)}</div>
    <div class="card prep"><h2>🧼 ${t("prep")}</h2>${list(c.prep)}</div>

    ${cityNote(id)}${city === "gyeonggi" ? `<div class="card"><p><a href="https://www.gg.go.kr" target="_blank" style="color:#2f6690;font-weight:700">www.gg.go.kr</a></p></div>` : ""}
    <div class="note">${t("districtNote")}</div>`;
}

function renderInfo() {
  return `

function renderPhoto() {
  return `
    <button class="back" onclick="location.hash='home'">${t("back")}</button>

      <div id="photoResult" class="card" style="display:none;white-space:pre-wrap;text-align:left"></div>
      <img id="preview" alt="">

let theme = "3d";
function wavy(s) {
  return [...s].map((c, i) => c === " " ? " " : `<span class="ch" style="animation-delay:${(i * 0.1).toFixed(2)}s">${c}</span>`).join("");
}
function applyTheme() {
  document.body.className = "theme-" + theme;
  document.getElementById("themeBtn").textContent = "🎨 " + (theme === "3d" ? "Мультфильм" : "Объём");
  document.querySelectorAll(".tile").forEach(el => {
    el.onmousemove = e => {
      if (theme !== "3d") return;
      const r = el.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5, y = (e.clientY - r.top) / r.height - 0.5;
      el.style.transform = `perspective(600px) rotateY(${x * 24}deg) rotateX(${-y * 24}deg) scale(1.05)`;
    };
    el.onmouseleave = () => { el.style.transform = ""; };
  });
}

function render() {
  const h = location.hash.replace("#","") || "home";
  let html;
  if (CATS[h]) html = renderCat(h);
  else if (h === "info") html = renderInfo();
  else if (h === "photo") html = renderPhoto();
  else html = renderHome();
  document.getElementById("app").innerHTML = html;
  const pv = document.getElementById("preview");
  if (pv && photoURL) { pv.src = photoURL; pv.style.display = "block"; }
  const pr = document.getElementById("photoResult");
  if (pr && photoAnswer) { pr.textContent = photoAnswer; pr.style.display = "block"; }
  document.getElementById("footer").textContent = t("footer");
  document.title = t("title");
  document.getElementById("brand").textContent = "♻️ " + t("title");
  document.getElementById("infoLabel").textContent = t("info");
  document.getElementById("photoLabel").textContent = t("photo");
  document.getElementById("infoBtn").classList.toggle("active", h === "info");
  document.getElementById("photoBtn").classList.toggle("active", h === "photo");
  document.documentElement.lang = lang;
  document.body.dataset.cat = CATS[h] ? h : "";
  document.getElementById("langSelect").value = lang;
  window.scrollTo(0, 0);
  applyTheme();
}

let photoFile = null, photoURL = "", photoAnswer = "";
const HEAD = {ru:["Что это","Как подготовить","Как выбросить"],ko:["무엇인가요","준비 방법","버리는 방법"],vi:["Đây là gì","Cách chuẩn bị","Cách bỏ"],en:["What it is","How to prepare","How to throw away"],ja:["これは何か","準備の仕方","捨て方"],zh:["是什么","如何准备","如何丢弃"]};
const ANALYZE = {ru:"Определить",ko:"판별하기",vi:"Nhận diện",en:"Identify",ja:"判定する",zh:"识别"};
const LANG_NAME = {ru:"Russian",ko:"Korean",vi:"Vietnamese",en:"English",ja:"Japanese",zh:"Simplified Chinese"};
const MSG = {
  pick:{ru:"Сначала выберите фото.",ko:"먼저 사진을 선택하세요.",vi:"Hãy chọn ảnh trước.",en:"Please choose a photo first.",ja:"先に写真を選んでください。",zh:"请先选择照片。"},
  off:{ru:"Распознавание сейчас недоступно. Войдите в аккаунт Claude и обновите страницу.",ko:"현재 인식 기능을 사용할 수 없습니다. Claude 계정에 로그인한 뒤 새로고침하세요.",vi:"Hiện không thể nhận diện. Hãy đăng nhập tài khoản Claude và tải lại trang.",en:"Recognition is unavailable right now. Sign in to Claude and reload the page.",ja:"現在認識機能は利用できません。Claudeにログインしてページを再読み込みしてください。",zh:"目前无法识别。请登录 Claude 账户后刷新页面。"},
  wait:{ru:"Смотрю на фото…",ko:"사진을 확인하는 중…",vi:"Đang xem ảnh…",en:"Looking at the photo…",ja:"写真を確認中…",zh:"正在查看照片…"},
  fail:{ru:"Не удалось определить. Попробуйте другое фото.",ko:"인식하지 못했습니다. 다른 사진을 시도하세요.",vi:"Không nhận diện được. Hãy thử ảnh khác.",en:"Could not identify. Try another photo.",ja:"判定できませんでした。別の写真をお試しください。",zh:"无法识别，请换一张照片。"}
};
const NETLIFY_MSG = {"ru": "Распознавание по фото работает только в Claude. Остальные разделы доступны.", "ko": "사진 인식은 Claude 안에서만 작동합니다. 나머지 기능은 모두 사용할 수 있습니다.", "vi": "Nhận diện ảnh chỉ hoạt động trong Claude. Các mục khác vẫn dùng được.", "en": "Photo recognition works only inside Claude. All other sections are available.", "ja": "写真認識はClaudeの中でのみ動作します。他の項目はすべてご利用いただけます。", "zh": "拍照识别仅在 Claude 中可用，其他内容均可正常使用。"};
async function analyzePhoto() {
  const box0 = document.getElementById("photoResult");
  box0.style.display = "block";
  box0.textContent = NETLIFY_MSG[lang] || NETLIFY_MSG.en;
  return;
}
async function analyzePhotoClaudeOnly() {
  const input = document.getElementById("photoInput");
  const box = document.getElementById("photoResult");
  const f = photoFile;
  box.style.display = "block";
  if (!f) { box.textContent = MSG.pick[lang]; return; }
  box.textContent = MSG.wait[lang];
  try {
    const sample = window.claude ? await window.claude.use("sample") : null;
    if (!sample) { box.textContent = MSG.off[lang]; return; }
    const prompt = `You help foreigners sort waste in South Korea. Identify the main item in the photo. Reply in ${LANG_NAME[lang]}, plain text, exactly three short lines labelled ${HEAD[lang][0]}, ${HEAD[lang][1]}, ${HEAD[lang][2]}. Line 1: item name and its category (one of: general waste, food waste, plastic, paper, cans and glass, electronics, bulky waste, dishes and cookware). Line 2: how to prepare it. Line 3: where to throw it. If you are not sure, say so in one short line.`;
    const r = await sample(prompt, { images: [f] });
    photoAnswer = (r && r.text) || "";
    box.textContent = photoAnswer || MSG.fail[lang];
  } catch (e) {
    box.textContent = MSG.fail[lang];
  }
}

function showPreview(e) {
  const f = e.target.files[0];
  if (!f) return;
  const img = document.getElementById("preview");
  photoFile = f;
  photoURL = URL.createObjectURL(f);
  photoAnswer = "";
  img.src = photoURL;
  img.style.display = "block";
}

document.getElementById("langSelect").addEventListener("change", e => { lang = e.target.value; try { localStorage.setItem("lang", lang); } catch (err) {} render(); if (photoFile && photoAnswer && location.hash === "#photo") analyzePhoto(); });
window.addEventListener("hashchange", render);
document.getElementById("themeBtn").addEventListener("click", () => { theme = theme === "3d" ? "toon" : "3d"; applyTheme(); });
render();
</script>
</body>
</html>
